<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0066ff">

    <title>MedicalCare | You're Offline</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
</head>

<body>

    <header>
        <h1>MedicalCare</h1>
        <p>No Internet Connection</p>
    </header>

    <main>

        <section class="card" role="alert">

            <h2>You're offline</h2>

            <p>
                MedicalCare needs an internet connection to show your
                appointments, patient information, and messages.
                Your information is kept safely on our server, not on
                this device.
            </p>

            <p>
                Please check your Wi-Fi or mobile data, then try again.
            </p>

            <button type="button" onclick="window.location.reload()">
                Try Again
            </button>

            <button
                type="button"
                onclick="speakOfflineMessage()"
                aria-label="Read the offline message aloud">
                🔊 Hear This Message
            </button>

        </section>

    </main>

    <script>
        function speakOfflineMessage() {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(
                    "You're offline. MedicalCare needs an internet connection. " +
                    "Please check your Wi-Fi or mobile data, then select Try Again."
                ));
            }
        }

        // Come back automatically as soon as the connection returns.
        window.addEventListener("online", function () {
            window.location.reload();
        });
    </script>

</body>

</html>
